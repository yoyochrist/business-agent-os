name: Build desktop downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - '.agents/skills/**'
      - '.github/workflows/build-desktop.yml'
      - 'requirements.txt'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: BusinessAgentOS-Windows
            binary: dist/BusinessAgentOS.exe
          - os: macos-latest
            artifact: BusinessAgentOS-macOS
            binary: dist/BusinessAgentOS
          - os: ubuntu-latest
            artifact: BusinessAgentOS-Linux
            binary: dist/BusinessAgentOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install "pyinstaller>=6.10,<7"
      - name: Build self-contained executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name BusinessAgentOS --add-data ".agents/skills:.agents/skills" app.py
      - name: Upload platform download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30
      - name: Add binary to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.binary }}" --clobber
